
<svg xmlns="http://www.w3.org/2000/svg" width="330" height="280" viewBox="0 0 330 280">
  <rect width="330" height="280" rx="12" fill="#0d1117"/>

  <text x="165" y="25" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12">ATHARVA.EXE</text>

  <g shape-rendering="crispEdges">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="1s" repeatCount="indefinite"/>

    <!-- Hair -->
    <rect x="110" y="40" width="110" height="30" fill="#20252d"/>
    <rect x="125" y="30" width="70" height="15" fill="#30363d"/>
    <rect x="105" y="60" width="120" height="20" fill="#161b22"/>

    <!-- Face -->
    <rect x="110" y="75" width="110" height="65" fill="#f0c36e"/>
    <rect x="100" y="85" width="10" height="40" fill="#f0c36e"/>

    <!-- Eyes -->
    <rect x="130" y="95" width="20" height="20" fill="#ffffff"/>
    <rect x="180" y="95" width="20" height="20" fill="#ffffff"/>
    <rect x="136" y="100" width="10" height="15" fill="#0d1117"/>
    <rect x="186" y="100" width="10" height="15" fill="#0d1117"/>

    <!-- Mouth -->
    <rect x="150" y="125" width="30" height="6" fill="#a94f49"/>

    <!-- Neck -->
    <rect x="145" y="140" width="40" height="15" fill="#d6a653"/>

    <!-- Body -->
    <path d="M115 155 L215 155 L205 200 L125 200 Z" fill="#2563a6"/>
    <rect x="130" y="165" width="70" height="5" fill="#58a6ff"/>

    <!-- Left arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 120 160;20 120 160;0 120 160" dur="1s" repeatCount="indefinite"/>
      <rect x="100" y="155" width="20" height="40" fill="#2563a6"/>
      <rect x="100" y="190" width="20" height="15" fill="#f0c36e"/>
    </g>

    <!-- Right waving arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 210 160;-45 210 160;-65 210 160;-45 210 160;0 210 160" dur="1s" repeatCount="indefinite"/>
      <rect x="210" y="155" width="20" height="40" fill="#2563a6"/>
      <rect x="210" y="190" width="20" height="15" fill="#f0c36e"/>
    </g>

    <!-- Legs -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,3;0,0" dur="1s" repeatCount="indefinite"/>
      <rect x="130" y="200" width="35" height="30" fill="#3b4654"/>
      <rect x="175" y="200" width="35" height="30" fill="#3b4654"/>
      <rect x="120" y="228" width="45" height="8" fill="#161b22"/>
      <rect x="175" y="228" width="45" height="8" fill="#161b22"/>
    </g>
  </g>

  <!-- Floating pixels -->
  <g fill="#58a6ff">
    <rect x="65" y="90" width="5" height="5">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" y="140" width="5" height="5">
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="165" y="260" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">ATHARVA • PIXEL ART</text>
</svg>
